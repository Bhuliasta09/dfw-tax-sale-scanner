name: Texas Tax Foreclosure Scanner

on:
  schedule:
    - cron: '0 12 * * 1,4' # Runs at 7:00 AM CDT on Mon and Thu
  workflow_dispatch:

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4

      - name: Run Scraper
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python tax_scraper.py

      - name: Commit State Tracking
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add seen_deals.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update seen deals" && git push)
